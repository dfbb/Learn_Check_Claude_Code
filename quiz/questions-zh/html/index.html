<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code 知识测验</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- View 1: Start -->
<div id="view-start" class="view active">
  <div class="start-card">
    <div class="logo">📝</div>
    <h1>Claude Code 知识测验</h1>
    <p class="subtitle">测试你对 Claude Code 的掌握程度</p>

    <div class="form-group">
      <label for="name-input">考生姓名</label>
      <input type="text" id="name-input" placeholder="请输入你的姓名" maxlength="50">
    </div>

    <div class="form-group">
      <label>选择难度</label>
      <div class="difficulty-options">
        <label class="diff-btn selected" id="diff-junior">
          <input type="radio" name="difficulty" value="junior" checked>
          <span class="diff-name">初级</span>
          <span class="diff-count">20 题</span>
        </label>
        <label class="diff-btn" id="diff-senior">
          <input type="radio" name="difficulty" value="senior">
          <span class="diff-name">中级</span>
          <span class="diff-count">30 题</span>
        </label>
        <label class="diff-btn" id="diff-power">
          <input type="radio" name="difficulty" value="power">
          <span class="diff-name">高级</span>
          <span class="diff-count">30 题</span>
        </label>
      </div>
    </div>

    <button class="btn-primary" id="btn-start">开始考试</button>
    <p class="error-msg" id="start-error"></p>
  </div>
</div>

<!-- View 2: Quiz -->
<div id="view-quiz" class="view">
  <div class="quiz-header">
    <span class="quiz-meta" id="quiz-progress">第 1 题 / 共 20 题</span>
    <span class="timer" id="timer">00分00秒</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="question-card">
    <span class="question-category" id="q-category"></span>
    <p class="question-text" id="q-text"></p>
    <div class="options-list" id="options-list"></div>
  </div>
  <button class="btn-next" id="btn-next" disabled>下一题</button>
  <p class="error-msg" id="quiz-error"></p>
</div>

<!-- View 3: Result -->
<div id="view-result" class="view">
  <div class="result-card">
    <div class="result-header">
      <div class="score-circle">
        <span class="score-pct" id="res-pct">0%</span>
        <span class="score-label" id="res-score">0/0</span>
      </div>
      <div class="result-meta">
        <span><strong id="res-name"></strong></span>
        <span>难度：<strong id="res-diff"></strong></span>
        <span>用时：<strong id="res-time"></strong></span>
      </div>
    </div>
    <ul class="result-list" id="result-list"></ul>
    <button class="btn-retry" id="btn-retry">重新考试</button>
  </div>
</div>

<script>
const DIFF_LABELS = { junior: '初级', senior: '中级', power: '高级' };

let state = {
  name: '', difficulty: 'junior',
  questions: [], answers: [],
  current: 0, elapsed: 0, timerID: null
};

// ── Difficulty selection ──
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

// ── Start ──
document.getElementById('btn-start').addEventListener('click', async () => {
  const name = document.getElementById('name-input').value.trim();
  const diff = document.querySelector('input[name="difficulty"]:checked').value;
  const errEl = document.getElementById('start-error');

  if (!name) { errEl.textContent = '请输入考生姓名'; return; }
  errEl.textContent = '';

  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = '加载题目中…';

  try {
    const res = await fetch(`/api/questions?difficulty=${diff}`);
    if (!res.ok) throw new Error(await res.text());
    const questions = await res.json();

    state = { name, difficulty: diff, questions, answers: new Array(questions.length).fill(null), current: 0, elapsed: 0, timerID: null };
    showQuiz();
  } catch (e) {
    errEl.textContent = '加载题目失败，请重试';
  } finally {
    btn.disabled = false;
    btn.textContent = '开始考试';
  }
});

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Quiz ──
function showQuiz() {
  showView('view-quiz');
  renderQuestion();
  state.timerID = setInterval(() => {
    state.elapsed++;
    const m = String(Math.floor(state.elapsed / 60)).padStart(2, '0');
    const s = String(state.elapsed % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${m}分${s}秒`;
  }, 1000);
}

function renderQuestion() {
  const { questions, current, answers } = state;
  const q = questions[current];
  const total = questions.length;

  document.getElementById('quiz-progress').textContent = `第 ${current + 1} 题 / 共 ${total} 题`;
  document.getElementById('progress-fill').style.width = `${(current / total) * 100}%`;
  document.getElementById('q-category').textContent = q.category || '';
  document.getElementById('q-text').textContent = q.question;

  const optList = document.getElementById('options-list');
  optList.innerHTML = '';
  const keys = ['a', 'b', 'c', 'd'];
  keys.forEach(k => {
    if (!q.options[k]) return;
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[current] === k ? ' selected' : '');
    btn.innerHTML = `<span class="option-key">${k.toUpperCase()}</span><span>${q.options[k]}</span>`;
    btn.addEventListener('click', () => selectOption(k));
    optList.appendChild(btn);
  });

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = current === total - 1 ? '提交答案' : '下一题';
  nextBtn.disabled = answers[current] === null;
  document.getElementById('quiz-error').textContent = '';
}

function selectOption(key) {
  state.answers[state.current] = key;
  document.querySelectorAll('.option-btn').forEach(btn => {
    const k = btn.querySelector('.option-key').textContent.toLowerCase();
    btn.classList.toggle('selected', k === key);
  });
  document.getElementById('btn-next').disabled = false;
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuestion();
  } else {
    submitQuiz();
  }
});

async function submitQuiz() {
  clearInterval(state.timerID);
  window.removeEventListener('beforeunload', onBeforeUnload);

  const btn = document.getElementById('btn-next');
  btn.disabled = true;
  btn.textContent = '提交中…';

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: state.name,
        difficulty: state.difficulty,
        answers: state.answers,
        questions: state.questions,
        elapsed_seconds: state.elapsed
      })
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    showResult(data);
  } catch {
    document.getElementById('quiz-error').textContent = '提交失败，请重试';
    btn.disabled = false;
    btn.textContent = '提交答案';
    state.timerID = setInterval(() => { state.elapsed++; }, 1000);
  }
}

// ── Result ──
function showResult(data) {
  showView('view-result');
  document.getElementById('res-pct').textContent = `${data.percent}%`;
  document.getElementById('res-score').textContent = `${data.correct}/${data.total}`;
  document.getElementById('res-name').textContent = state.name;
  document.getElementById('res-diff').textContent = DIFF_LABELS[state.difficulty];
  const m = Math.floor(state.elapsed / 60), s = state.elapsed % 60;
  document.getElementById('res-time').textContent = `${m}分${s}秒`;

  const list = document.getElementById('result-list');
  list.innerHTML = '';
  state.questions.forEach((q, i) => {
    const userAns = state.answers[i] || '';
    const isCorrect = userAns.toLowerCase() === q.correct.toLowerCase();
    const li = document.createElement('li');
    li.className = 'result-item';
    li.innerHTML = `
      <div class="result-item-header">
        <span class="result-icon ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✓' : '✗'}</span>
        <span class="result-q">${q.question}</span>
      </div>
      ${!isCorrect ? `<div class="result-detail">
        你的答案：${userAns.toUpperCase() || '未作答'} &nbsp;|&nbsp;
        <span class="correct-ans">正确答案：${q.correct.toUpperCase()}</span><br>
        ${q.explanation || ''}
      </div>` : ''}
    `;
    list.appendChild(li);
  });
}

document.getElementById('btn-retry').addEventListener('click', () => {
  showView('view-start');
});

// ── Abandon on unload ──
function onBeforeUnload() {
  if (state.questions.length === 0) return;
  navigator.sendBeacon('/api/abandon', JSON.stringify({
    name: state.name,
    difficulty: state.difficulty,
    answered: state.answers.filter(a => a !== null).length,
    total: state.questions.length
  }));
}
window.addEventListener('beforeunload', onBeforeUnload);
</script>
</body>
</html>
